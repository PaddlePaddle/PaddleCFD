hydra:
  run:
    dir: outputs/confild_case2/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: ${mode}
    chdir: false

# Setting
mode: train  # "train" or "test"
seed: 2025
output_dir: ${hydra:run.dir}
log_freq: 20

# Training Configuration
TRAIN:
  batch_size: 10
  test_batch_size: 10
  epochs: 44500
  num_gpus: 1         # Number of GPUs (>1 for distributed training)
  num_workers: 4      # Number of data loading workers
  lr:
    cnf: 1.e-4      # CNF learning rate
    latents: 1.e-5  # Latent codes learning rate

# CNF Model Configuration
CONFILD:
  input_keys: ["confild_x", "latent_z"]
  output_keys: ["confild_output"]
  num_hidden_layers: 10
  out_features: 4          # Number of output features (u, v, w, p for 3D channel flow)
  hidden_features: 256     # Larger hidden features for complex flow
  in_coord_features: 2     # Coordinate dimension (2D slice of 3D flow)
  in_latent_features: 256  # Latent dimension

# Latent Container Configuration
LATENT:
  input_keys: ["latent_x"]
  output_keys: ["latent_z"]
  N_samples: 1200   # Total number of samples (channel flow)
  lumped: False     # Not lumped for channel flow
  N_features: 256   # Latent dimension
  dims: 2           # Spatial dimension

# Data Configuration
DATA:
  data_path: data/Case2/case2_data.npy
  coor_path: null   # No explicit coordinates for channel flow (structured grid)
  normalizer:
    method: "-11"  # Normalization method
    dim: 0
  load_data_fn: load_channel_flow  # Data loading function name

# Checkpoint
checkpoint: null  # Path to resume training or for testing
