hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: ${mode}
    chdir: false

# Setting
mode: train  # "train" or "test"
seed: 2025
output_dir: ${hydra:run.dir}
log_freq: 20

# Training Configuration
TRAIN:
  batch_size: 64
  test_batch_size: 256
  epochs: 9800
  num_gpus: 1         # Number of GPUs (>1 for distributed training)
  num_workers: 4      # Number of data loading workers
  lr:
    cnf: 1.e-4      # CNF learning rate
    latents: 1.e-5  # Latent codes learning rate

# CNF Model Configuration
CONFILD:
  input_keys: ["confild_x", "latent_z"]
  output_keys: ["confild_output"]
  num_hidden_layers: 10
  out_features: 3          # Number of output features (e.g., u, v, p)
  hidden_features: 128
  in_coord_features: 2     # Coordinate dimension
  in_latent_features: 128  # Latent dimension

# Latent Container Configuration
LATENT:
  input_keys: ["latent_x"]
  output_keys: ["latent_z"]
  N_samples: 16000  # Total number of samples
  lumped: True
  N_features: 128   # Latent dimension
  dims: 2           # Spatial dimension

# Data Configuration
DATA:
  data_path: data/Case1/case1_data.npy
  coor_path: data/Case1/case1_coords.npy
  normalizer:
    method: "-11"  # Normalization method: "-11", "01", "ms", "none"
    dim: 0
  load_data_fn: load_elbow_flow  # Data loading function name

# Checkpoint
checkpoint: null  # Path to resume training or for testing
