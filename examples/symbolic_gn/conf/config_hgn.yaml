hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    name: ${mode}
    chdir: false
  sweep:
    dir: ${hydra.run.dir}
    subdir: ./

# Setting
mode: train
seed: 42
output_dir: ${hydra:run.dir}
log_freq: 20

# Model Architecture - Hamiltonian Graph Network
MODEL:
  arch: "HGN"
  hidden: 300
  regularization_type: "none"  # HGN doesn't use L1 regularization
  l1_strength: 0.0

# Data Configuration
DATA:
  type: "spring"  # Conservative systems work best: "spring", "r2", "charge"
  num_samples: 1000
  num_nodes: 6
  dimension: 2
  time_steps: 100
  time_step_size: 0.01
  sample_interval: 5

# Training Hyperparameters
TRAIN:
  epochs: 1000
  batch_size: 32
  save_freq: 100
  optimizer:
    learning_rate: 1e-3
    weight_decay: 1e-8
  lr_scheduler:
    name: "CosineAnnealingDecay"
    gamma: 0.95  # 仅用于ExponentialDecay
  loss:
    type: "MAE"

# Distributed Training
enable_ddp: false

# Checkpoint
checkpoint: null
pred_ckpt: null
